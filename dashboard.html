<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#087a45">

    <title>Khalox — Dashboard</title>


    <style>

        /* ==========================================
           KHALOX DASHBOARD
           COMPLETE SELF-CONTAINED VERSION
        ========================================== */


        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f5f8f6;

            color: #17221c;

            line-height: 1.5;
        }


        a {
            text-decoration: none;
            color: inherit;
        }


        button,
        input {
            font-family: inherit;
        }


        button {
            cursor: pointer;
        }


        .container {
            width: min(1180px, 92%);

            margin: 0 auto;
        }



        /* ==========================================
           NAVBAR
        ========================================== */


        .navbar {
            position: sticky;

            top: 0;

            z-index: 9999;

            background: #ffffff;

            border-bottom:
                1px solid #e4ebe7;
        }


        .nav-inner {
            height: 74px;

            display: flex;

            align-items: center;

            justify-content: space-between;
        }


        .logo {
            font-size: 26px;

            font-weight: 900;

            letter-spacing: -1px;

            color: #087a45;
        }


        .logo span {
            color: #15a15a;
        }


        #navLinks {
            display: flex;

            align-items: center;

            gap: 28px;
        }


        #navLinks a {
            font-size: 14px;

            font-weight: 700;

            color: #425048;

            transition: .2s;
        }


        #navLinks a:hover {
            color: #087a45;
        }


        .menu-btn {
            display: none;

            width: 46px;

            height: 46px;

            border-radius: 13px;

            border:
                1px solid #dce7e1;

            background: #ffffff;

            color: #087a45;

            font-size: 24px;
        }



        /* ==========================================
           MAIN
        ========================================== */


        .dashboard {
            padding:
                42px 0 80px;
        }


        .dashboard-header {
            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 25px;

            margin-bottom: 30px;
        }


        .eyebrow {
            display: inline-block;

            margin-bottom: 8px;

            color: #087a45;

            font-size: 12px;

            font-weight: 900;

            letter-spacing: 1.5px;
        }


        .dashboard-header h1 {
            font-size:
                clamp(32px, 5vw, 48px);

            line-height: 1.05;

            letter-spacing: -1.5px;

            margin-bottom: 12px;

            color: #111a15;
        }


        .dashboard-header p {
            color: #68756e;

            font-size: 15px;
        }



        /* ==========================================
           BUTTONS
        ========================================== */


        .btn {
            min-height: 48px;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            padding:
                0 21px;

            border-radius: 11px;

            border: none;

            font-size: 14px;

            font-weight: 800;
        }


        .btn-primary {
            color: #ffffff;

            background: #087a45;

            box-shadow:
                0 8px 20px
                rgba(8,122,69,.18);
        }


        .btn-primary:hover {
            background: #066437;
        }


        .btn-secondary {
            color: #087a45;

            background: #edf7f1;

            border:
                1px solid #d9ebdf;
        }



        /* ==========================================
           WALLET + STATS
        ========================================== */


        .dashboard-grid {
            display: grid;

            grid-template-columns:
                2fr 1fr 1fr;

            gap: 18px;

            margin-bottom: 50px;
        }


        .wallet-card {
            min-height: 215px;

            padding: 28px;

            border-radius: 22px;

            color: #ffffff;

            background:
                linear-gradient(
                    135deg,
                    #075e35,
                    #087a45 55%,
                    #12a35d
                );

            box-shadow:
                0 18px 40px
                rgba(8,122,69,.18);

            display: flex;

            flex-direction: column;

            justify-content: space-between;
        }


        .wallet-top {
            display: flex;

            justify-content: space-between;

            gap: 15px;

            color:
                rgba(255,255,255,.82);

            font-size: 12px;

            font-weight: 700;
        }


        .wallet-label {
            margin-bottom: 5px;
        }


        .wallet-balance {
            font-size:
                clamp(32px, 5vw, 45px);

            font-weight: 900;

            letter-spacing: -1.5px;
        }


        .wallet-bottom {
            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            font-size: 13px;
        }


        .wallet-bottom a {
            font-weight: 800;

            color: #ffffff;
        }


        .stat-card {
            min-height: 215px;

            padding: 24px;

            border-radius: 20px;

            background: #ffffff;

            border:
                1px solid #e2ebe5;

            box-shadow:
                0 8px 25px
                rgba(20,50,30,.04);

            display: flex;

            flex-direction: column;
        }


        .stat-icon {
            width: 48px;

            height: 48px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 14px;

            background: #edf8f1;

            font-size: 22px;

            margin-bottom: 18px;
        }


        .stat-card h3 {
            font-size: 27px;

            margin-bottom: 3px;

            color: #17221c;
        }


        .stat-card p {
            color: #68756e;

            font-size: 14px;

            margin-bottom: auto;
        }


        .stat-card a {
            color: #087a45;

            font-size: 13px;

            font-weight: 800;
        }


        .stat-note {
            color: #8a958f;

            font-size: 12px;
        }



        /* ==========================================
           SECTIONS
        ========================================== */


        .dashboard-section {
            margin-top: 50px;
        }


        .section-heading {
            margin-bottom: 20px;
        }


        .section-heading h2 {
            font-size: 28px;

            line-height: 1.15;

            color: #17221c;
        }



        /* ==========================================
           SERVICE CARDS
        ========================================== */


        .service-grid {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 16px;
        }


        .service-link {
            min-height: 155px;

            padding: 22px;

            background: #ffffff;

            border:
                1px solid #e2ebe5;

            border-radius: 18px;

            display: flex;

            flex-direction: column;

            justify-content: flex-start;

            transition:
                transform .2s ease,
                box-shadow .2s ease,
                border-color .2s ease;
        }


        .service-link:hover {
            transform:
                translateY(-4px);

            border-color:
                #9fd3b5;

            box-shadow:
                0 12px 30px
                rgba(20,60,35,.08);
        }


        .service-icon {
            width: 47px;

            height: 47px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 13px;

            background: #edf8f1;

            font-size: 21px;

            margin-bottom: 17px;
        }


        .service-link b {
            font-size: 16px;

            color: #17221c;

            margin-bottom: 4px;
        }


        .service-link small {
            color: #718078;

            font-size: 13px;
        }



        /* ==========================================
           TRANSACTION TABLE
        ========================================== */


        .table-card {
            background: #ffffff;

            border:
                1px solid #e2ebe5;

            border-radius: 18px;

            overflow: hidden;

            box-shadow:
                0 8px 25px
                rgba(20,50,30,.04);
        }


        .table-wrap {
            width: 100%;

            overflow-x: auto;
        }


        table {
            width: 100%;

            min-width: 650px;

            border-collapse:
                collapse;
        }


        th {
            padding:
                16px 20px;

            text-align: left;

            background: #f5faf7;

            border-bottom:
                1px solid #e4ece7;

            color: #68756e;

            font-size: 11px;

            text-transform:
                uppercase;

            letter-spacing: .7px;
        }


        td {
            padding:
                17px 20px;

            border-bottom:
                1px solid #edf1ee;

            color: #3c4942;

            font-size: 14px;
        }


        tr:last-child td {
            border-bottom: none;
        }


        .transaction-service {
            font-weight: 800;

            color: #17221c;
        }


        .status {
            display: inline-flex;

            align-items: center;

            padding:
                6px 10px;

            border-radius: 30px;

            font-size: 11px;

            font-weight: 800;
        }


        .status.success {
            color: #08753f;

            background: #e9f8ef;
        }



        /* ==========================================
           EMPTY TRANSACTIONS
        ========================================== */


        .empty-state {
            padding: 42px 20px;

            text-align: center;

            color: #7b8780;
        }


        .empty-icon {
            width: 52px;

            height: 52px;

            display: flex;

            align-items: center;

            justify-content: center;

            margin:
                0 auto 12px;

            border-radius: 15px;

            background: #edf8f1;

            font-size: 23px;
        }


        .empty-state strong {
            display: block;

            color: #35423b;

            margin-bottom: 4px;
        }


        .empty-state span {
            font-size: 13px;
        }



        /* ==========================================
           REFERRAL
        ========================================== */


        .referral-card {
            margin-top: 50px;

            padding: 28px;

            background: #ffffff;

            border:
                1px solid #e2ebe5;

            border-radius: 20px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 25px;
        }


        .referral-card h2 {
            font-size: 25px;

            margin-bottom: 5px;
        }


        .referral-card p {
            color: #68756e;

            font-size: 14px;
        }


        .referral-code {
            display: flex;

            align-items: center;

            gap: 10px;

            padding: 7px 7px 7px 15px;

            border:
                1px solid #dce9e1;

            background: #f3f8f5;

            border-radius: 12px;
        }


        .referral-code span {
            color: #087a45;

            font-weight: 900;

            font-size: 13px;
        }


        .referral-code button {
            padding:
                10px 14px;

            border: none;

            border-radius: 8px;

            background: #087a45;

            color: #ffffff;

            font-size: 12px;

            font-weight: 800;
        }



        /* ==========================================
           ACCOUNT
        ========================================== */


        .account-card {
            padding: 23px;

            border:
                1px solid #e2ebe5;

            background: #ffffff;

            border-radius: 18px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;
        }


        .account-card strong {
            font-size: 16px;
        }


        .account-card p {
            color: #68756e;

            font-size: 13px;

            margin-top: 5px;
        }



        /* ==========================================
           FOOTER
        ========================================== */


        .footer {
            padding: 30px 0;

            background: #ffffff;

            border-top:
                1px solid #e3ebe6;
        }


        .footer-inner {
            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;
        }


        .footer p {
            color: #7a857f;

            font-size: 13px;
        }



        /* ==========================================
           TABLET
        ========================================== */


        @media (max-width: 900px) {

            .dashboard-grid {
                grid-template-columns:
                    1fr 1fr;
            }


            .wallet-card {
                grid-column:
                    1 / -1;
            }


            .service-grid {
                grid-template-columns:
                    repeat(2, 1fr);
            }

        }



        /* ==========================================
           MOBILE
        ========================================== */


        @media (max-width: 650px) {

            .container {
                width: 92%;
            }


            .nav-inner {
                height: 68px;
            }


            .menu-btn {
                display: block;
            }


            #navLinks {
                display: none;

                position: absolute;

                top: 68px;

                left: 0;

                right: 0;

                padding: 10px 4% 18px;

                background: #ffffff;

                border-bottom:
                    1px solid #e5ece7;

                box-shadow:
                    0 15px 30px
                    rgba(0,0,0,.08);

                flex-direction: column;

                align-items: stretch;

                gap: 0;
            }


            #navLinks a {
                padding: 14px 10px;

                border-bottom:
                    1px solid #edf1ee;
            }


            .dashboard {
                padding:
                    30px 0 60px;
            }


            .dashboard-header {
                flex-direction: column;

                align-items: stretch;

                margin-bottom: 24px;
            }


            .dashboard-header h1 {
                font-size: 35px;
            }


            .dashboard-header p {
                font-size: 14px;
            }


            .dashboard-header .btn {
                width: 100%;
            }


            .dashboard-grid {
                grid-template-columns: 1fr;

                gap: 13px;

                margin-bottom: 35px;
            }


            .wallet-card {
                grid-column: auto;

                min-height: 190px;

                padding: 22px;
            }


            .wallet-balance {
                font-size: 34px;
            }


            .stat-card {
                min-height: 145px;

                padding: 20px;
            }


            .stat-icon {
                width: 42px;

                height: 42px;

                margin-bottom: 12px;
            }


            .stat-card h3 {
                font-size: 24px;
            }


            .dashboard-section {
                margin-top: 35px;
            }


            .section-heading {
                margin-bottom: 15px;
            }


            .section-heading h2 {
                font-size: 24px;
            }


            /*
              IMPORTANT:
              Two service cards per row
              on mobile.
            */

            .service-grid {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));

                gap: 11px;
            }


            .service-link {
                min-height: 135px;

                padding: 16px;

                border-radius: 16px;
            }


            .service-icon {
                width: 40px;

                height: 40px;

                font-size: 18px;

                margin-bottom: 12px;

                border-radius: 11px;
            }


            .service-link b {
                font-size: 14px;
            }


            .service-link small {
                font-size: 11px;

                line-height: 1.3;
            }


            .table-card {
                border-radius: 15px;
            }


            .referral-card {
                flex-direction: column;

                align-items: stretch;

                padding: 22px;

                margin-top: 35px;
            }


            .referral-card h2 {
                font-size: 22px;
            }


            .referral-code {
                width: 100%;

                flex-direction: column;

                align-items: stretch;

                padding: 11px;
            }


            .referral-code span {
                text-align: center;

                padding: 5px;
            }


            .referral-code button {
                width: 100%;
            }


            .account-card {
                flex-direction: column;

                align-items: stretch;
            }


            .account-card .btn {
                width: 100%;
            }


            .footer-inner {
                flex-direction: column;

                align-items: flex-start;
            }

        }



        /* ==========================================
           VERY SMALL PHONES
        ========================================== */


        @media (max-width: 370px) {

            .service-grid {
                grid-template-columns: 1fr;
            }


            .service-link {
                min-height: 125px;
            }


            .wallet-balance {
                font-size: 30px;
            }

        }

    </style>

</head>


<body>
