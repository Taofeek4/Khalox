<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login — Khalox</title>
    <meta name="description" content="Login to your Khalox account.">

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-body">

    <!-- BRAND -->
    <a href="index.html" class="brand auth-brand">
        <span>K</span>
        KHALOX
    </a>


    <!-- LOGIN -->
    <main class="auth-wrap">

        <section class="auth-card">

            <span class="eyebrow">
                WELCOME BACK
            </span>

            <h1>Login to Khalox</h1>

            <p>
                Access your wallet and manage your digital services
                from one place.
            </p>


            <form id="loginForm">

                <!-- EMAIL -->
                <label>
                    Email address

                    <input
                        type="email"
                        id="loginEmail"
                        name="email"
                        placeholder="you@example.com"
                        required
                        autocomplete="email"
                    >
                </label>


                <!-- PASSWORD -->
                <label>
                    Password

                    <div style="position:relative;">

                        <input
                            type="password"
                            id="loginPassword"
                            name="password"
                            placeholder="Enter your password"
                            required
                            minlength="6"
                            autocomplete="current-password"
                            style="padding-right:80px;"
                        >

                        <button
                            type="button"
                            onclick="togglePassword('loginPassword', this)"
                            style="
                                position:absolute;
                                right:8px;
                                top:50%;
                                transform:translateY(-50%);
                                border:0;
                                background:none;
                                color:#635bff;
                                font-weight:800;
                                cursor:pointer;
                            "
                        >
                            Show
                        </button>

                    </div>
                </label>


                <!-- OPTIONS -->
                <label class="form-row">

                    <span class="check">
                        <input type="checkbox" id="remember">
                        Remember me
                    </span>

                    <a href="#" onclick="forgotPassword(event)">
                        Forgot password?
                    </a>

                </label>


                <!-- LOGIN BUTTON -->
                <button
                    type="submit"
                    class="primary-btn full"
                >
                    Login to Account →
                </button>

            </form>


            <!-- DIVIDER -->
            <div class="or">
                OR
            </div>


            <!-- REGISTER -->
            <p class="auth-bottom">
                Don't have a Khalox account?
                <a href="register.html">
                    Create one
                </a>
            </p>


            <!-- BACK -->
            <p class="auth-bottom">

                <a href="index.html">
                    ← Back to Khalox
                </a>

            </p>

        </section>

    </main>


    <script src="js/app.js"></script>

    <script>

        function togglePassword(inputId, button) {

            const input = document.getElementById(inputId);

            if (input.type === "password") {

                input.type = "text";
                button.textContent = "Hide";

            } else {

                input.type = "password";
                button.textContent = "Show";

            }

        }


        function forgotPassword(event) {

            event.preventDefault();

            alert(
                "Password recovery will be connected when the Khalox backend and account system are added."
            );

        }

    </script>

</body>
</html>
